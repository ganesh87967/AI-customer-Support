server.port=${PORT:8080}

# MySQL / TiDB Cloud Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_support?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring AI (OpenAI-Compatible -> Defaults to Google Gemini Free Tier)
# To switch to Groq, set AI_BASE_URL=https://api.groq.com/openai and AI_MODEL=llama-3.3-70b-versatile
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${AI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-2.0-flash}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.temperature=0.2

# JWT Configuration
app.jwt.secret=${JWT_SECRET:vcube-hack-quest-2026-smart-support-super-secret-key-256bit}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
